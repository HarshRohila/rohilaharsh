{{ define "main" }}
  <div class="list-page">
    <div class="container">
      <h1 class="list-title">{{ .Title }}</h1>
      {{ with .Content }}
        <div class="list-description">{{ . }}</div>
      {{ end }}

      <div class="posts-list">
        {{ range .Paginator.Pages }}
          {{ .Render "summary-with-image" }}
        {{ end }}
      </div>

      {{ template "_internal/pagination.html" . }}
    </div>
  </div>
{{ end }}
