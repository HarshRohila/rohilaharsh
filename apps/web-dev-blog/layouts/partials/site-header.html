{{ partial "site-navigation.html" . }}
{{ if .IsHome }}
  {{ $featured_image := partial "func/GetFeaturedImage.html" . }}
  <section class="hero"{{ if $featured_image }} style="background-image: url('{{ (trim $featured_image "/") | absURL }}')"{{ end }}>
    <div class="hero-content">
      <div class="hero-label">Available for interesting projects</div>
      <h1 class="hero-title">{{ .Title | default .Site.Title }}<br><span class="hero-gradient-text">Web Development.</span><br>Mostly.</h1>
      {{ with .Params.description }}
        <p class="hero-tagline">{{ . | safeHTML }}</p>
      {{ end }}
      <div class="hero-line"></div>
    </div>
  </section>
{{ end }}
